can <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#cyber-grad)" />
  <circle cx="10%" cy="20%" r="15%" fill="#d946ef" opacity="0.3" filter="url(#blur)" />
  <circle cx="90%" cy="80%" r="20%" fill="#06b6d4" opacity="0.3" filter="url(#blur)" />
  <circle cx="50%" cy="50%" r="25%" fill="#8b5cf6" opacity="0.2" filter="url(#blur)" />
</svg>