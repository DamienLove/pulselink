<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="ocean-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#ocean-grad)" />
  <circle cx="50%" cy="100%" r="40%" fill="#0ea5e9" opacity="0.2" filter="url(#blur)" />
  <circle cx="20%" cy="20%" r="10%" fill="#38bdf8" opacity="0.1" filter="url(#blur)" />
</svg>