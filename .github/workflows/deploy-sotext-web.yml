name: Deploy SoText Web

on:
  push:
    branches:
      - sotext.app
      - beta
      - alpha
    paths:
      - 'web/**'
      - '.github/workflows/deploy-sotext-web.yml'
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 🎯 Resolve Channel
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "alpha" ]; then
            echo "BUILD_SCRIPT=build:alpha" >> "$GITHUB_ENV"
            echo "LOCAL_DIR=./web/dist-alpha/" >> "$GITHUB_ENV"
            echo "SERVER_DIR=/home/qthdunpa/domains/sotext.app/public_html/alpha/" >> "$GITHUB_ENV"
          elif [ "$BRANCH" = "beta" ]; then
            echo "BUILD_SCRIPT=build:beta" >> "$GITHUB_ENV"
            echo "LOCAL_DIR=./web/dist-beta/" >> "$GITHUB_ENV"
            echo "SERVER_DIR=/home/qthdunpa/domains/sotext.app/public_html/beta/" >> "$GITHUB_ENV"
          else
            echo "BUILD_SCRIPT=build:prod" >> "$GITHUB_ENV"
            echo "LOCAL_DIR=./web/dist-prod/" >> "$GITHUB_ENV"
            echo "SERVER_DIR=/home/qthdunpa/domains/sotext.app/public_html/" >> "$GITHUB_ENV"
          fi
          echo "Deploying branch '$BRANCH' with '$BUILD_SCRIPT' to '$SERVER_DIR'"

      - name: 📦 Build Web App
        run: |
          cd web
          npm ci
          npm run "${BUILD_SCRIPT}"

      - name: 🚀 Deploy to Host (SFTP)
        env:
          SFTP_HOST: server8.webhostmost.com
          SFTP_PORT: "2323"
          SFTP_USER: qthdunpa
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_PASS" ]; then
            echo "SFTP_PASSWORD secret is not set."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 5
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose "${LOCAL_DIR}" "${SERVER_DIR}"
          bye
          EOF
