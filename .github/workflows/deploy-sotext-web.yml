name: Deploy SoText Web

on:
  push:
    branches:
      - sotext.app
      - beta
      - alpha
    paths:
      - 'web/**'
      - '.github/workflows/deploy-sotext-web.yml'
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 🎯 Resolve Channel
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "alpha" ]; then
            echo "BUILD_SCRIPT=build:alpha" >> "$GITHUB_ENV"
            echo "LOCAL_DIR=./web/dist-alpha/" >> "$GITHUB_ENV"
            echo "SERVER_DIR=./public_html/alpha/" >> "$GITHUB_ENV"
          elif [ "$BRANCH" = "beta" ]; then
            echo "BUILD_SCRIPT=build:beta" >> "$GITHUB_ENV"
            echo "LOCAL_DIR=./web/dist-beta/" >> "$GITHUB_ENV"
            echo "SERVER_DIR=./public_html/beta/" >> "$GITHUB_ENV"
          else
            echo "BUILD_SCRIPT=build:prod" >> "$GITHUB_ENV"
            echo "LOCAL_DIR=./web/dist-prod/" >> "$GITHUB_ENV"
            echo "SERVER_DIR=./public_html/" >> "$GITHUB_ENV"
          fi
          echo "Deploying branch '$BRANCH' with '$BUILD_SCRIPT' to '$SERVER_DIR'"

      - name: 📦 Build Web App
        run: |
          cd web
          npm ci
          npm run "${BUILD_SCRIPT}"

      - name: 🚀 Deploy to Host
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server8.webhostmost.com
          username: qthdunpa
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 2323
          protocol: sftp
          local-dir: ${{ env.LOCAL_DIR }}
          server-dir: ${{ env.SERVER_DIR }}
          dangerous-clean-slate: false
